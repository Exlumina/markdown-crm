<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown CRM</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div class="workspace-brand"><span class="brand-mark">◈</span><span>Markdown CRM</span><span class="local-label">Local workspace</span></div><div class="header-actions"><select id="theme" aria-label="Appearance"><option value="system">System theme</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="guide">Workflow guide</button><button id="new" class="primary">+ Add record</button></div></header>
<div class="workspace-heading"><nav id="nav" aria-label="CRM workspace"></nav><h1 id="title" class="sr-only">Fundraising</h1></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search this list" aria-label="Search this list"><select id="funding" aria-label="Filter funding stage"><option value="">All funding stages</option></select><select id="industry" aria-label="Filter industry"><option value="">All industries</option></select><button id="needsReply" aria-pressed="false">Needs reply <span id="replyCount">0</span></button><label class="empty-toggle"><input id="showEmpty" type="checkbox">Show empty stages</label><div class="view-toggle" role="group" aria-label="View"><button id="boardView">Board</button><button id="tableView">Table</button></div><button id="refresh" aria-label="Refresh records">↻</button></div>
<div id="status" role="status" aria-live="polite">Loading your Vault…</div><section id="content" aria-label="CRM records"></section>
</main>
<dialog id="drawer" aria-labelledby="detailTitle"><div class="drawer-header"><div><div id="detailEyebrow" class="hint">Record</div><h2 id="detailTitle">Record</h2></div><button type="button" id="close" aria-label="Close record">×</button></div><section id="readView"></section>
<form id="form" hidden><label>Name<input name="name" required maxlength="2000"></label><label>Type<select name="kind"><option value="company">Company</option><option value="person">Person</option></select></label><label>Website<input name="website" type="url" placeholder="https://" maxlength="2000"></label><div class="field-pair"><label>Investment rating<select name="investmentRating"><option value="">Unrated</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></label><label>Last communication<input name="lastCommunication" type="date"></label></div><label>Communication type<select name="communicationType"><option value="">Unrecorded</option><option value="email">Email</option><option value="call">Call</option><option value="video_call">Video call</option><option value="meeting">Meeting</option><option value="message">Message</option><option value="other">Other</option></select></label><div class="field-pair"><label>Reply status<select name="replyStatus"><option value="">Unrecorded</option><option value="needs_reply">Needs reply</option><option value="waiting_on_them">Waiting on them</option><option value="done">Done</option></select></label><label>Reply due<input name="replyDueAt" type="date"></label></div><label>Next action<textarea name="nextAction" rows="2" maxlength="4000"></textarea></label><label>Funding stages<span class="hint">Comma-separated tags</span><input name="fundingStages" placeholder="Pre-seed, Seed"></label><label>Industries<span class="hint">Comma-separated tags</span><input name="industries" placeholder="Climate, Robotics"></label><div id="memberships"></div><label>Notes<textarea name="notes" rows="7" maxlength="30000"></textarea></label><p id="formError" role="alert"></p><div class="drawer-footer"><button type="button" id="cancelEdit">Cancel</button><span id="saveState">Save to apply changes</span><button type="submit" class="primary">Save changes</button></div></form></dialog>
<dialog id="workflow" aria-labelledby="workflowTitle"><div class="drawer-header"><h2 id="workflowTitle">Workflow guide</h2><button id="closeGuide" aria-label="Close workflow guide">×</button></div><div id="workflowContent"></div></dialog>
<script src="/app.js"></script></body></html>
